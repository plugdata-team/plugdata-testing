name: plugdata tests

# Manual trigger only (Actions tab -> "plugdata tests" -> "Run workflow").
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "plugdata branch to clone and test"
        default: "develop"
        required: true
      enable_asan:
        description: "Build with AddressSanitizer"
        type: boolean
        default: true

env:
  PLUGDATA_REPO: https://github.com/plugdata-team/plugdata.git
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: ubuntu-24.04
            platform: linux
            cmake_extra: ""
          - name: macOS
            runs-on: macos-latest
            platform: macos
            cmake_extra: ""
          - name: Windows
            runs-on: windows-2022
            platform: windows
            # Windows runs without Sfizz because that breaks std::string and std::vector annotations for ASAN
            cmake_extra: "-DENABLE_SFIZZ=0 -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_FLAGS:STRING=' /bigobj' -DCMAKE_CXX_FLAGS:STRING=' /bigobj /EHsc'"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # ---- Dependencies -------------------------------------------------
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive TZ="Europe/Amsterdam" apt install -y cmake git wget bzip2 build-essential libasound2-dev libjack-jackd2-dev curl libcurl4-openssl-dev libfreetype6-dev libx11-dev libxi-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxrandr-dev libxkbcommon-dev libxinerama-dev ccache python3 python3-pip freeglut3-dev unzip ninja-build libfontconfig-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install ninja ccache

      - name: Set up MSVC environment (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Windows)
        if: matrix.platform == 'windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 1200M

      # ---- Clone plugdata (with its own submodules) ---------------------
      - name: Clone plugdata (${{ github.event.inputs.branch }})
        shell: bash
        run: |
          git clone \
            --branch "${{ github.event.inputs.branch }}" \
            --depth 1 \
            --recurse-submodules --shallow-submodules \
            "$PLUGDATA_REPO" plugdata
          echo "Cloned $(git -C plugdata rev-parse HEAD) on branch ${{ github.event.inputs.branch }}"

      # ---- Configure + build the standalone -----------------------------
      - name: Configure
        working-directory: plugdata
        run: |
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTING=1 -DENABLE_ASAN=${{ github.event.inputs.enable_asan }} -DENABLE_GEM=0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.cmake_extra }}

      - name: Build standalone
        working-directory: plugdata
        run: cmake --build build --target plugdata_standalone

      # ---- Software OpenGL for the headless Windows runner ---------------
      # GitHub's windows runners have no GPU and only expose generic GDI
      # OpenGL 1.1, but plugdata's NanoVG surface needs an OpenGL 3.2 context.
      # Without one the app prints "could not initialise nvg" and the UI tests
      # (which render through that surface) hang forever. Drop Mesa's llvmpipe
      # opengl32.dll next to the executable so the context is created in
      # software, and force the software path via the MESA/GALLIUM env vars.
      - name: Install software OpenGL (Mesa llvmpipe)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # Pinned: pal1000/mesa-dist-win 26.2.6 dropped OpenGL software rendering from its MSVC build
          url="https://github.com/mmozeiko/build-mesa/releases/download/26.3.0/mesa-llvmpipe-x64-26.3.0.7z"
          echo "Downloading Mesa: $url"
          curl -fsSL -o mesa.7z "$url"
          7z x -y mesa.7z -omesa >/dev/null
          gl=$(find mesa -iname opengl32.dll | head -1)
          if [ -z "$gl" ]; then
            echo "::error::No opengl32.dll in the Mesa archive"; find mesa -type f; exit 1
          fi
          echo "Mesa dlls in: $(dirname "$gl")"
          cp "$(dirname "$gl")"/*.dll plugdata/Plugins/Standalone/
          # Force llvmpipe and advertise a >=3.2 GL/GLSL version
          {
            echo "GALLIUM_DRIVER=llvmpipe"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "MESA_GL_VERSION_OVERRIDE=4.5"
            echo "MESA_GLSL_VERSION_OVERRIDE=450"
          } >> "$GITHUB_ENV"

      # ---- Run the test suite -------------------------------------------
      - name: Run tests
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/run-and-check.sh"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.name }}
          path: test-output.log
          if-no-files-found: ignore
